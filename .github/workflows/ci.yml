# NetGuard CI: линт + тесты на Linux/macOS/Windows, Python 3.9–3.12
name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
      - name: Lint with flake8
        run: |
          # стоп при синтаксических ошибках и undefined names
          flake8 netguard tests setup_hooks.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # остальные замечания — warnings (строка 127, сложность 10)
          flake8 netguard tests setup_hooks.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flake8
          pip install .
      - name: Collect plugins sanity check (from repo root)
        run: python -m netguard plugins
      - name: Sanity check from inside package dir (regression for ModuleNotFoundError)
        working-directory: netguard
        run: python -c "import netguard.cli, netguard.engine, netguard.models"
      - name: Test with pytest
        # запуск из корня репозитория; conftest.py добавляет его в sys.path,
        # поэтому тесты идут по исходникам даже без установки пакета
        run: python -m pytest tests -v --tb=short -p no:cacheprovider

  package:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netguard-dist
          path: dist/*
