[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netguard"
version = "1.0.0"
description = "Кроссплатформенный сканер уязвимостей локальной сети для сисадминов и ИБ-инженеров (без root, без зависимостей)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{name = "DarkShy", email = "darkshy.bel@gmail.com"}]
keywords = ["security", "vulnerability-scanner", "network", "nmap", "audit", "infosec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# факультативно: более точный разбор сертификатов
certs = ["cryptography>=38"]

[project.scripts]
netguard = "netguard.cli:main"

[tool.setuptools.packages.find]
include = ["netguard*"]
